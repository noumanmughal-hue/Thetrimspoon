<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Dashboard | The Trim Spoon</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="staff.css">
</head>
<body class="staff-body">

  <header class="staff-header">
    <h1>Staff Dashboard</h1>
    <button id="refresh-btn" class="btn btn-primary" type="button">Refresh</button>
  </header>

  <main class="staff-main">
    <div class="orders-toolbar">
      <div class="status-tabs" role="tablist" aria-label="Filter orders by status">
        <button type="button" class="status-tab" data-status="active" aria-selected="true">Active Orders</button>
        <button type="button" class="status-tab" data-status="history" aria-selected="false">Completed / History</button>
        <button type="button" class="status-tab" data-status="all" aria-selected="false">All Orders</button>
      </div>
      <div class="search-bar">
        <input type="search" id="search-input" placeholder="Search by order ID, customer name, or phone…" aria-label="Search orders">
        <button type="button" id="reset-filters-btn" class="btn btn-reset" hidden>Clear Search</button>
      </div>
    </div>

    <table class="orders-table">
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Items</th>
          <th>Fulfillment</th>
          <th>Customer</th>
          <th>Total</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="orders-body"></tbody>
    </table>
    <p id="empty-message" class="empty-message" hidden>No orders yet.</p>
    <p id="status-message" class="status-message" hidden></p>

    <div class="pagination" id="pagination" hidden>
      <button type="button" id="prev-page-btn" class="btn btn-page">Previous</button>
      <span id="pagination-info" class="pagination-info"></span>
      <button type="button" id="next-page-btn" class="btn btn-page">Next</button>
    </div>
  </main>

  <script src="staff.js"></script>
</body>
</html>
